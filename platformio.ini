; Two environments, one per OLED panel. Pick the one matching the display that
; is wired up. Everything else is identical:
;
;   pio run -e oled_128x64 -t upload
;   pio run -e oled_128x32 -t upload
;
; Credentials are NOT here; they live in include/secrets.h (gitignored).
; Option reference: https://docs.platformio.org/page/projectconf.html

[common]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
; AsyncMqttClient is deliberately not in this list; it lives in lib/ instead.
lib_deps =
	bblanchon/ArduinoJson@^7.2.2
	esp32async/AsyncTCP@^3.4.10
	adafruit/Adafruit AHTX0@^2.0.6
	adafruit/Adafruit BMP280 Library@^3.0.0
	adafruit/Adafruit SSD1306@^2.5.16

[env:oled_128x64]
extends = common
build_flags =
	${common.build_flags}
	-DOLED_HEIGHT=64

[env:oled_128x32]
extends = common
build_flags =
	${common.build_flags}
	-DOLED_HEIGHT=32
